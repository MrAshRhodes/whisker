name: Bug report
description: Report something that is not working.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first.
        For a security vulnerability, do not use this public form:
        https://github.com/MrAshRhodes/whisker/security/advisories/new
        Use synthetic examples and remove sensitive information from attachments.

  - type: input
    id: whisker-version
    attributes:
      label: Whisker version
      description: Find this in About Whisker. For a source build, include the commit.
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 14.7"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Homebrew
        - ZIP
        - DMG
        - Built from source
    validations:
      required: true

  - type: input
    id: mouse
    attributes:
      label: Mouse or trackpad
      description: Make and model, and how it connects (USB, Bluetooth or a receiver).
      placeholder: "Example: Logitech MX Master 3S over Bluetooth"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include relevant settings and whether it happens every time.
      placeholder: |
        1. Open Whisker.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include any error message.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: |
        Optional. Remove sensitive information before uploading and inspect the
        final image.

  - type: textarea
    id: permissions
    attributes:
      label: Permissions
      description: |
        Optional. Is Whisker enabled under System Settings > Privacy & Security >
        Accessibility (and Input Monitoring, if listed)?
